# Validasi skema manifest (kubeconform) untuk setiap push & PR ke main.
# Dikecualikan: secret terenkripsi (*.enc.yaml), generator KSOPS, values Helm, dan data ConfigMap (litellm-config.yaml).
name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kubeconform:
    runs-on: ubuntu-24.04
    env:
      KUBECONFORM_VERSION: "0.7.0"
      KUBECONFORM_SHA256: "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pasang kubeconform (checksum diverifikasi)
        run: |
          curl -fsSL -o /tmp/kc.tgz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kc.tgz" | sha256sum -c -
          tar -xzf /tmp/kc.tgz -C /tmp kubeconform
          /tmp/kubeconform -v
      - name: validasi skema
        run: |
          files=$(find . -name '*.yaml' -not -path './.git/*' -not -name '*.enc.yaml' \
            -not -name 'secret-generator.yaml' -not -name '.sops.yaml' \
            -not -name 'values.yaml' -not -name 'litellm-config.yaml')
          /tmp/kubeconform -summary -strict -ignore-missing-schemas -kubernetes-version 1.36.0 $files
