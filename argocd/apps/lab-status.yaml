apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-status
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/teguhmuflih/lab-gitops.git
    targetRevision: main
    path: apps/lab-status
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
