apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-app-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/teguhmuflih/lab-gitops.git
    targetRevision: main
    path: apps/lab-app/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-app-prod
  # prod: sync MANUAL (UI/CLI) — gerbang promosi setelah dev terverifikasi
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
