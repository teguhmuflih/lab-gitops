# Akun baca-saja untuk Prometheus di 403. Prometheus berada di luar cluster dan mengakses metrik lewat
# API server (6443, sudah dibuka dari mgmt): kubelet, cAdvisor, kube-state-metrics, apiserver.
# Token dibaca Ansible (role monitoring) dari Secret di bawah → /etc/prometheus/k8s/token di 403.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-scraper
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-scraper
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, nodes/proxy, nodes/stats]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services/proxy]
    resourceNames: ["kube-state-metrics:http-metrics", "kube-state-metrics:telemetry", "lab-status:http"]
    verbs: [get]
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-scraper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-scraper
subjects:
  - kind: ServiceAccount
    name: prometheus-scraper
    namespace: monitoring
---
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-scraper-token
  annotations:
    kubernetes.io/service-account.name: prometheus-scraper
type: kubernetes.io/service-account-token
