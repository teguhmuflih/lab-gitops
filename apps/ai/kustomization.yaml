apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai
resources:
  - litellm.yaml
  - phoenix.yaml
configMapGenerator:
  - name: litellm-config
    files: [config.yaml=litellm-config.yaml]
generators:
  - secret-generator.yaml    # KSOPS: ai-secrets (LITELLM_MASTER_KEY), phoenix-auth (htpasswd)
